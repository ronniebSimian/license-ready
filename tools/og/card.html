<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:linear-gradient(135deg,#0b6b3a 0%,#0e8a4b 100%);font-family:"Noto Sans",system-ui,sans-serif;color:#fff;position:relative}
.road{position:absolute;right:0;top:0;bottom:0;width:430px;background:#1d2a22;clip-path:polygon(28% 0,100% 0,100% 100%,0 100%)}
.lane{position:absolute;right:205px;top:0;bottom:0;width:14px;background:repeating-linear-gradient(#ffd23f 0 60px,transparent 60px 110px);transform:skewX(-9deg)}
.logo{position:absolute;left:70px;top:62px;width:150px;height:150px;border-radius:34px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{position:absolute;left:70px;top:236px;margin:0;font-size:80px;line-height:1;font-weight:800;letter-spacing:-2px}
h1 span{color:#ffd23f}
.sub{position:absolute;left:72px;top:345px;font-size:31px;line-height:1.3;width:640px;font-weight:500}
.pills{position:absolute;left:72px;top:482px;display:flex;gap:10px;width:720px}
.pill{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);border-radius:99px;padding:7px 16px;font-size:22px;white-space:nowrap;font-weight:600}
.sign{position:absolute;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
</style></head><body>
<div class="road"></div><div class="lane"></div>
<img class="logo" src="../../icons/icon.svg">
<h1>License Ready <span>Idaho</span></h1>
<div class="sub">Get ready for the Idaho driver&rsquo;s knowledge test in short daily rounds that adapt to you.</div>
<div class="pills"><span class="pill">Free</span><span class="pill">Works offline</span><span class="pill">6 languages</span><span class="pill">Mock exam</span></div>
<img class="sign" src="../../states/idaho/signs/R1-1.svg" style="right:150px;top:46px;width:190px">
<img class="sign" src="../../states/idaho/signs/W11-3.svg" style="right:48px;top:250px;width:170px">
<img class="sign" src="../../states/idaho/signs/R1-2.svg" style="right:245px;top:395px;width:150px">
<img class="sign" src="../../states/idaho/signs/S1-1.svg" style="right:60px;top:452px;width:130px">
</body></html>
